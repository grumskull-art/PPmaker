[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "powerpoint-app"
version = "0.1.0"
description = "Lokal dansk undervisningspræsentation fra dokumenter og slideplaner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib==3.10.6",
  "Pillow==12.0.0",
  "pydantic==2.11.9",
  "pypdf==6.1.1",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
]

[project.optional-dependencies]
ui = ["PySide6==6.11.2"]
windows = ["pywin32==311; platform_system == 'Windows'", "pyinstaller==6.16.0"]
test = ["pytest==8.4.2"]

[project.scripts]
powerpoint-app = "powerpoint_app.cli:main"
powerpoint-app-ui = "powerpoint_app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
